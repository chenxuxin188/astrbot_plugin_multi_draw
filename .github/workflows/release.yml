name: Release

# 推送 v1.2.3 形式的标签时发布：先跑 CI，再检查标签与 metadata.yaml 的版本号一致、
# 标签指向 main 上的提交，最后用 CHANGELOG.md 中该版本的内容创建 GitHub Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Create release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 检查标签指向 main 上的提交
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交不在 main 分支上，请先把改动合并到 main 再打标签"
            exit 1
          fi
      - name: 检查版本号并生成发布说明
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
