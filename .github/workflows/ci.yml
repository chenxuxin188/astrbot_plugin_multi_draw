name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 发布流程先调用本工作流，检查通过后才创建 Release
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: python -m pip install ruff==0.17.5
      - name: ruff check
        run: ruff check --output-format=github .
      - name: 检查版本号与更新日志
        run: python .github/scripts/release_notes.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # AstrBot 4.10 起支持 Python 3.10；新版本要求 3.12 及以上
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest pillow
      - name: pytest
        run: python -m pytest tests -q
